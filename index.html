<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/img/icon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="canonical" href="https://noticiasguayaquil.ec/" />

    <!-- Estos meta existen como plantilla: `scripts/ssg-meta.mjs` los reescribe
         por página en el build, `server.js` los reescribe por nota, y
         `usePageSeo` los actualiza al navegar dentro de la SPA. -->
    <title>Noticias Guayaquil | Lo que pasa en la ciudad, hoy</title>
    <meta name="description" content="Las noticias de Guayaquil de los principales medios de la ciudad, reunidas en un solo lugar. Titulares, extracto y enlace directo al medio que las publicó." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0284c7" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noticias Guayaquil" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:url" content="https://noticiasguayaquil.ec/" />
    <meta property="og:title" content="Noticias Guayaquil | Lo que pasa en la ciudad, hoy" />
    <meta property="og:description" content="Las noticias de Guayaquil de los principales medios de la ciudad, reunidas en un solo lugar." />
    <meta property="og:image" content="https://noticiasguayaquil.ec/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noticias Guayaquil | Lo que pasa en la ciudad, hoy" />
    <meta name="twitter:description" content="Las noticias de Guayaquil de los principales medios de la ciudad, reunidas en un solo lugar." />
    <meta name="twitter:image" content="https://noticiasguayaquil.ec/img/og.png" />

    <!-- Tema: se aplica antes del primer paint para evitar el flash blanco -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('ngye-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
