<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/img/icon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="canonical" href="https://guayashoy.com/" />

    <!-- Inter variable, autoalojada: la CSP solo permite fuentes del propio
         dominio. Se precarga porque cada titular de la primera pantalla la usa. -->
    <link
      rel="preload"
      href="/fonts/Inter-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Estos meta existen como plantilla: `scripts/ssg-meta.mjs` los reescribe
         por página en el build, `server.js` los reescribe por nota, y
         `usePageSeo` los actualiza al navegar dentro de la SPA. -->
    <title>Guayas Hoy | Lo que pasa en la provincia, hoy</title>
    <meta name="description" content="Las noticias del Guayas de los principales medios de la provincia, reunidas en un solo lugar. Titulares, extracto y enlace directo al medio que las publicó." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guayas Hoy" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:url" content="https://guayashoy.com/" />
    <meta property="og:title" content="Guayas Hoy | Lo que pasa en la provincia, hoy" />
    <meta property="og:description" content="Las noticias del Guayas de los principales medios de la provincia, reunidas en un solo lugar." />
    <meta property="og:image" content="https://guayashoy.com/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guayas Hoy | Lo que pasa en la provincia, hoy" />
    <meta name="twitter:description" content="Las noticias del Guayas de los principales medios de la provincia, reunidas en un solo lugar." />
    <meta name="twitter:image" content="https://guayashoy.com/img/og.png" />

    <!-- Tema: se aplica antes del primer paint para evitar el flash.
         El sitio nace en claro; solo pasa a oscuro si el lector lo eligió
         antes. Si el almacenamiento está bloqueado, gana el claro igual. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('guayashoy-theme');
        } catch (e) {}
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
